# Serves the built SPA and proxies /api to the backend on the SAME ORIGIN.
#
# Same-origin is not a convenience here, it is required by two things:
#   1. api/client.js hardcodes the base URL as "/api" - there is no
#      REACT_APP_* override in the frontend.
#   2. The refresh cookie is SameSite=Strict. A different registrable domain
#      for the API would mean the browser never attaches it and no session
#      could be established.

server {
    listen 80;
    server_name _;
    # No application is served over plaintext - the refresh cookie is Secure
    # and would be discarded, so a working HTTP path would only ever be a
    # confusing half-broken one.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Supply real certificates at these paths. Self-signed will work for a
    # staging smoke test; a browser will refuse the Secure cookie behind an
    # untrusted certificate, so this cannot be skipped.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Security headers for the SPA document ----------------------------
    # The backend sets its own headers on API responses, but it never serves
    # index.html - so without these the page that actually holds the access
    # token in memory would have no CSP at all. This is the control that most
    # directly protects it.
    #
    # script-src has no 'unsafe-inline': the production build emits no inline
    # script (INLINE_RUNTIME_CHUNK=false in the Dockerfile keeps it that way),
    # so injected script cannot execute even if markup injection is achieved.
    # style-src does need it - MUI/emotion injects <style> at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 6m;   # slightly above the API's own 5 MB upload cap

    # ---- API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://hrms-api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # ClientAddressResolver only believes this header when the direct peer
        # is listed in APP_TRUSTED_PROXIES - set that to this container's
        # address, or login throttling will bucket every user together.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a whole-company payroll or attendance run, which are
        # synchronous today (see the async job item in the implementation plan).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Static SPA -------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so these are safe to cache hard.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves clients on stale
    # bundles referencing files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
